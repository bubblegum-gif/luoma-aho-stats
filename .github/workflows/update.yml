name: Päivitä sivu tunneittain

on:
  schedule:
    - cron: '0 * * * *'  # joka tunti, tasalta (UTC)
  workflow_dispatch: # mahdollistaa käsin ajamisen nappia painamalla

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet (jos tulee myöhemmin)
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Aja update.py
        run: python update.py

      - name: Commit ja push jos muutoksia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html last_update.txt || true
          if git diff --staged --quiet; then
            echo "Ei muutoksia - ei commitia"
          else
            git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
