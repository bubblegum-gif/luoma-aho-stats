
name: Update Luoma-aho stats v2
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'udisc_export.csv'
      - 'data/udisc_export.csv'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Run scraper
        run: python scraper.py
      - name: Commit if changed
        run: |
          git config user.name "luoma-aho-bot"
          git config user.email "bot@luoma-aho.fi"
          git add data.json
          git diff --cached --quiet || git commit -m "auto: update $(date -u +%Y-%m-%dT%H:%M:%SZ) Metrix 44010+44763 + UDisc"
          git push
