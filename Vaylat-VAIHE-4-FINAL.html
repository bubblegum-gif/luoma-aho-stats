<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Väylä Data</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#000;font-family:Inter,system-ui,sans-serif;padding:20px 20px 5px 20px}
.wrap{max-width:1280px;margin:0 auto;border:2px dashed rgba(255,255,255,.8);border-radius:12px;padding:20px 20px 5px 20px;background:#000}
.header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.title{color:#fff;font-weight:900;font-size:24px;letter-spacing:-0.5px}
.badge-live{background:#0f3d0f;color:#00FF00;border:1px solid #00FF00;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:800;text-transform:lowercase}
.pill-helppo{background:#00FF00;color:#000}
.pill-haastava{background:#FFEB00;color:#000}
.pill-vaativa{background:#FF8B00;color:#000}
.pill-vaikein{background:#FF0000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{border-radius:10px;padding:8px;min-height:132px;position:relative;border:1px solid rgba(0,0,0,.2);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;background:rgba(0,0,0,.1);border-radius:50%}
.name{font-weight:900;font-size:13px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.par{font-size:16.5px;margin-top:4px;font-weight:900;color:#000;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px;display:inline-block;opacity:1}
.birdie-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
.birdie-label{font-size:11px;font-weight:900;color:#000;background:rgba(255,255,255,.9);padding:2px 6px;border-radius:4px}
.birdie-pct{font-size:13px;font-weight:900;color:#000;background:#fff;padding:2px 6px;border-radius:4px;border:1px solid rgba(0,0,0,.1)}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:8px;background:rgba(255,255,255,.9);color:#000;padding:2px 6px;border-radius:4px;font-weight:600}
.over{font-size:11px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="title">VÄYLIEN VAATIVUUS LUOKITTELU</div><div class="badge-live">AUTO LIVE</div></div>
<div class="legend">
<div class="pill pill-helppo">Helpoin</div>
<div class="pill pill-haastava">Kontrolli</div>
<div class="pill pill-vaativa">Teknisin</div>
<div class="pill pill-vaikein">Vaativa</div>
</div>
<div class="grid" id="vaylat-grid"></div>
</div>
<script>
async function loadVaylat(){
  const grid = document.getElementById('vaylat-grid');
  let holes = [];
  try{
    const res = await fetch('data.json?ts='+Date.now(), {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(data.vaylat && data.vaylat.holes && data.vaylat.holes.length){
        holes = data.vaylat.holes;
      }
    }
  }catch(e){}
  if(!holes.length){
    try{
      const res2 = await fetch('Vaylat-Data.json?ts='+Date.now(), {cache:'no-store'});
      if(res2.ok){
        const vdata = await res2.json();
        const byNum = {};
        (vdata.holes||[]).forEach(h=>{ const n=h.hole; if(!byNum[n]) byNum[n]=h; });
        holes = Object.keys(byNum).sort((a,b)=>a-b).map(k=>byNum[k]).filter(h=>h.hole>=1 && h.hole<=12);
      }
    }catch(e){}
  }
  if(!holes.length){
    holes = [
      {hole:1,name:"Russian Roulette",par:4,dist_m:125,dist_ft:410,birdie_pct:20,avg_44010:4.67,avg_44763:4.50,over:0.58,diff:"#FF8B00"},
      {hole:2,name:"Valonpolku",par:3,dist_m:103,dist_ft:338,birdie_pct:38,avg_44010:3.77,avg_44763:3.57,over:0.67,diff:"#00FF00"},
      {hole:3,name:"Kännän Kuiskaus",par:3,dist_m:72,dist_ft:236,birdie_pct:11,avg_44010:3.57,avg_44763:3.17,over:0.37,diff:"#FFEB00"},
      {hole:4,name:"Julle Special",par:3,dist_m:58,dist_ft:189,birdie_pct:23,avg_44010:3.27,avg_44763:3.37,over:0.32,diff:"#FF0000"},
      {hole:5,name:"Nice & Tight",par:3,dist_m:94,dist_ft:308,birdie_pct:51,avg_44010:3.6,avg_44763:3.37,over:0.48,diff:"#00FF00"},
      {hole:6,name:"Tiikerin loikka",par:3,dist_m:96,dist_ft:315,birdie_pct:30,avg_44010:4.23,avg_44763:4.03,over:1.13,diff:"#FF0000"},
      {hole:7,name:"Haukansilmä",par:3,dist_m:102,dist_ft:336,birdie_pct:36,avg_44010:4.17,avg_44763:3.6,over:0.88,diff:"#FFEB00"},
      {hole:8,name:"Kepposen Kirous",par:3,dist_m:80,dist_ft:264,birdie_pct:14,avg_44010:3.5,avg_44763:2.97,over:0.23,diff:"#FFEB00"},
      {hole:9,name:"Helvetin nousu",par:4,dist_m:116,dist_ft:381,birdie_pct:22,avg_44010:5.03,avg_44763:4.2,over:0.62,diff:"#FF8B00"},
      {hole:10,name:"Drop Zone",par:3,dist_m:85,dist_ft:279,birdie_pct:39,avg_44010:4.23,avg_44763:3.97,over:1.10,diff:"#FF8B00"},
      {hole:11,name:"Monsteri",par:5,dist_m:197,dist_ft:646,birdie_pct:12,avg_44010:6.53,avg_44763:5.93,over:1.23,diff:"#FF0000"},
      {hole:12,name:"Mossen mutka",par:4,dist_m:120,dist_ft:394,birdie_pct:25,avg_44010:4.3,avg_44763:4.13,over:0.22,diff:"#00FF00"}
    ];
  }
  const colorMap = {1:"#FF8B00",2:"#00FF00",3:"#FFEB00",4:"#FF0000",5:"#00FF00",6:"#FF0000",7:"#FFEB00",8:"#FFEB00",9:"#FF8B00",10:"#FF8B00",11:"#FF0000",12:"#00FF00"};
  grid.innerHTML = holes.slice(0,12).map(h=>{
    const bg = h.diff || h.difficulty_color || colorMap[h.hole] || "#00FF00";
    const name = h.name || h.hole_name || ("Väylä "+h.hole);
    const par = h.par || 3;
    const dm = h.dist_m || h.distance_m || 0;
    const df = h.dist_ft || h.distance_ft || 0;
    const birdie = h.birdie_pct ?? h.birdie_percent ?? 0;
    const avg1 = h.avg_44010 ?? h.average_44010 ?? "";
    const avg2 = h.avg_44763 ?? h.average_44763 ?? "";
    const over = h.over ?? h.over_par ?? "";
    return `<div class="card" style="background:${bg}"><div class="dot"></div><div class="name">${h.hole} ${name}</div><div class="par">Par ${par} • ${dm}m • ${df}ft</div><div class="birdie-row"><span class="birdie-label">BIRDIE%</span><span class="birdie-pct">${birdie}%</span></div><div class="badges"><span class="badge">44010 ${avg1}</span><span class="badge">44763 ${avg2}</span></div><div class="over">+${over} over</div></div>`;
  }).join('');
}
loadVaylat();
setInterval(loadVaylat, 5*60*1000);
</script>
</body>
</html>
