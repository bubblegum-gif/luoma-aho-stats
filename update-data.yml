name: Auto 5min v4.0 - kaytossa oleva pohja
on:
  schedule:
    - cron: '*/10 * * * *' # 10min, ei 5min
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python fetch_data.py # JUURESSA, ei scripts/
      - run: |
          git config user.name "bot"
          git config user.email "bot@luoma-aho.fi"
          git add *.json # FLAT juuressa, ei data/
          git diff --staged --quiet || (git commit -m "auto v10 $(date -Iseconds) 1140/123" && git push)
